name: Release

on:
  push:
    tags:
      - "v*"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      local_core_sha:
        description: Exact commit SHA with authenticated local live SQL acceptance
        required: false
        type: string
        default: ''

permissions:
  contents: read
  statuses: read

jobs:
  core-tests:
    uses: ./.github/workflows/core-tests.yml
    with:
      local_core_sha: ${{ inputs.local_core_sha || '' }}

  release:
    permissions:
      contents: write
    needs: core-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Java and Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Read version notes from the changelog
        run: python3 scripts/extract-release-notes.py > "$RUNNER_TEMP/release-notes.md"
      
      - name: Setup gpg
        run: |
          mkdir ~/.gnupg
          echo use-agent >> ~/.gnupg/gpg.conf
          echo pinentry-mode loopback >> ~/.gnupg/gpg.conf
          echo allow-loopback-pinentry >> ~/.gnupg/gpg-agent.conf

      - name: Release Maven package
        uses: samuelmeuli/action-maven-publish@v1
        with:
          gpg_private_key: ${{ secrets.gpg_private_key }}
          gpg_passphrase: ${{ secrets.gpg_passphrase }}
          nexus_username: ${{ secrets.nexus_token_username }}
          nexus_password: ${{ secrets.nexus_token_password }}
          server_id: ossrh
          maven_args: -DskipTests -Dmaven.deploy.timeout=600

      - name: Publish to GitHub Packages
        run: mvn clean package -DskipTests

      - name: Upload Release
        uses: ncipollo/release-action@v1
        with:
          bodyFile: ${{ runner.temp }}/release-notes.md
          allowUpdates: false
          omitName: true
          artifacts: 'target/odps-jdbc-*.jar'
          token: ${{ github.token }}
