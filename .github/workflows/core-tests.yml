name: JDBC 3.9 release acceptance
on:
  workflow_dispatch:
    inputs:
      local_core_sha:
        description: Exact commit with authenticated packaged-driver live SQL acceptance
        required: true
        type: string
  workflow_call:
    inputs:
      local_core_sha:
        description: Exact commit with authenticated packaged-driver live SQL acceptance
        required: false
        type: string
        default: ''
permissions:
  contents: read
  statuses: read
jobs:
  packaged-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build candidate and run compatibility regressions
        run: mvn -B -ntp clean package -Dtest=TypedResultOptionTest,MaxQAFallbackBackportTest,ResultSetLifecycleTest,UpdateCountTaskNameTest,InstanceDataIteratorCloseTest,SettingParserTest,UtilsTest -DfailIfNoTests=true
      - uses: actions/upload-artifact@v4
        with:
          name: jdbc-39-candidate
          path: target/odps-jdbc-*-jar-with-dependencies.jar
          if-no-files-found: error
  verified-live-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require authenticated live SQL acceptance for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.local_core_sha || github.sha }}
          RELEASE_ACTOR: ${{ github.actor }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses" --paginate > "$RUNNER_TEMP/live-status.json"
          python3 - <<'PYCODE'
          import json, os
          statuses = json.load(open(os.environ["RUNNER_TEMP"] + "/live-status.json"))
          matching = [s for s in statuses if s["context"] == "jdbc-packaged-live-core"]
          assert matching, "No live SQL acceptance status for this commit"
          latest = matching[0]
          assert latest["state"] == "success", "Live SQL acceptance is not successful"
          assert latest["creator"]["login"] == os.environ["RELEASE_ACTOR"], "Acceptance must be reported by the release operator"
          print("Verified packaged-driver live SQL acceptance for " + os.environ["EXPECTED_SHA"])
          PYCODE
