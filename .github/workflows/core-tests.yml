name: JDBC core SQL acceptance

on:
  push:
    branches: [master, "codex/jdbc-395-maxqa-fallback"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build candidate and run dependency regression tests
        run: mvn -B -ntp clean package -Dtest=MaxQAFallbackBackportTest,ResultSetLifecycleTest,SettingParserTest,UtilsTest -DfailIfNoTests=true
      - name: Obtain regression project credentials
        id: credentials
        uses: aliyun/configure-aliyun-credentials-action@v1.0.7
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          oidc-provider-arn: ${{ secrets.OIDC_ARN }}
          role-session-name: jdbc-core-acceptance
          role-session-expiration: 1800
          audience: actions.github.com
      - name: Test packaged driver against MaxCompute
        timeout-minutes: 10
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ steps.credentials.outputs.aliyun-access-key-id }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ steps.credentials.outputs.aliyun-access-key-secret }}
          ALIBABA_CLOUD_SECURITY_TOKEN: ${{ steps.credentials.outputs.aliyun-security-token }}
          MAXCOMPUTE_ENDPOINT: ${{ secrets.ENDPOINT }}
          MAXCOMPUTE_PROJECT: go_sdk_regression_testing
        run: |
          version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("pom.xml").getroot().find("{http://maven.apache.org/POM/4.0.0}version").text)')
          bash scripts/jdbc-core-smoke.sh "target/odps-jdbc-${version}-jar-with-dependencies.jar"
