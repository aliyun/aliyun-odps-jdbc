name: JDBC core SQL acceptance

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      local_core_sha:
        description: Commit SHA with independently completed live SQL acceptance
        required: false
        type: string
        default: ''

permissions:
  contents: read
  statuses: read
  id-token: write

jobs:
  core:
    if: ${{ !inputs.local_core_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build candidate and run dependency regression tests
        run: mvn -B -ntp clean package -Dtest=DependencyCompatibilityTest,MaxQARoutingFailureTest,OdpsArrayTest#testLegacyArrayGetObjectConnectionDefault -DfailIfNoTests=true
      - name: Obtain regression project credentials
        id: credentials
        uses: aliyun/configure-aliyun-credentials-action@v1.0.7
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          oidc-provider-arn: ${{ secrets.OIDC_ARN }}
          role-session-name: jdbc-core-acceptance
          role-session-expiration: 1800
          audience: actions.github.com
      - name: Test packaged driver against MaxCompute
        timeout-minutes: 10
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ steps.credentials.outputs.aliyun-access-key-id }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ steps.credentials.outputs.aliyun-access-key-secret }}
          ALIBABA_CLOUD_SECURITY_TOKEN: ${{ steps.credentials.outputs.aliyun-security-token }}
          MAXCOMPUTE_ENDPOINT: ${{ secrets.ENDPOINT }}
          MAXCOMPUTE_PROJECT: go_sdk_regression_testing
        run: |
          version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("pom.xml").getroot().find("{http://maven.apache.org/POM/4.0.0}version").text)')
          bash scripts/jdbc-core-smoke.sh "target/odps-jdbc-${version}.jar"

  verified-local-core:
    if: ${{ inputs.local_core_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build the same candidate and run regression tests
        run: mvn -B -ntp clean package -Dtest=DependencyCompatibilityTest,MaxQARoutingFailureTest,OdpsArrayTest#testLegacyArrayGetObjectConnectionDefault -DfailIfNoTests=true
      - name: Require authenticated live SQL acceptance for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.local_core_sha }}
          RELEASE_ACTOR: ${{ github.actor }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses" --paginate > "$RUNNER_TEMP/live-status.json"
          python3 - <<'PYCODE'
          import json, os
          statuses = json.load(open(os.environ["RUNNER_TEMP"] + "/live-status.json"))
          matching = [s for s in statuses if s["context"] == "jdbc-packaged-live-core"]
          assert matching, "No live SQL acceptance status for this commit"
          latest = matching[0]
          assert latest["state"] == "success", "Live SQL acceptance is not successful"
          assert latest["creator"]["login"] == os.environ["RELEASE_ACTOR"], "Acceptance must be reported by the release operator"
          print("Verified packaged-driver live SQL acceptance for " + os.environ["EXPECTED_SHA"])
          PYCODE
